<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 72" width="270" height="72" role="img" aria-label="HRMS People Platform" xmlns:c2pa="http://c2pa.org/manifest">
  <title>HRMS – People Platform</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25705F"/>
      <stop offset="1" stop-color="#0A2622"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C25B"/>
      <stop offset="1" stop-color="#DE9A2B"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2F2A"/>
      <stop offset="1" stop-color="#25705F"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect width="72" height="72" rx="20" fill="url(#bg)"/>
  <rect width="72" height="72" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="71" height="71" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <!-- person 1 -->
  <circle cx="28" cy="26" r="6.5" fill="#FFFDF8"/>
  <path d="M17 54V47a11 11 0 0 1 22 0V54Z" fill="#FFFDF8"/>
  <!-- person 2 (overlaps, separated by a gap) -->
  <g stroke="#143E36" stroke-width="2.5" stroke-linejoin="round" fill="url(#amber)">
    <circle cx="46" cy="26" r="6.5"/>
    <path d="M35 54V47a11 11 0 0 1 22 0V54Z"/>
  </g>
  <!-- platform base -->
  <rect x="15" y="58" width="42" height="3" rx="1.5" fill="#FFFDF8" fill-opacity=".4"/>

  <!-- Custom lettering: HRMS -->
  <g fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 14V42M111 14V42M95 28H111"/>
    <path d="M129 42V14H141a7.5 7.5 0 0 1 0 15H129M139 29L148 42"/>
    <path d="M163 42V14L177 33L191 14V42"/>
    <path d="M226 20Q226 14 215.5 14Q205 14 205 21Q205 28 215.5 28Q226 28 226 35Q226 42 215.5 42Q205 42 205 36"/>
  </g>
  <circle cx="240" cy="40" r="3.5" fill="url(#amber)"/>

  <!-- Tagline -->
  <text x="93" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.6" fill="#5E6B66">PEOPLE PLATFORM</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
